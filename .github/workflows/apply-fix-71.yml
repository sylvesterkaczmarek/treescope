name: Apply PRNG key deferred repr fix

on:
  push:
    branches:
      - fix/prng-key-deferred-repr-71

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch PRNG key repr
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matched {count} times')
              return text.replace(old, new)

          source_path = Path('treescope/external/jax_support.py')
          source = source_path.read_text()
          old = '''  edgeitems = np.get_printoptions()["edgeitems"]
  edge_items_per_axis = []
  for size in array.shape:
    if size > 2 * edgeitems + 1:
      edge_items_per_axis.append(edgeitems)
    else:
      edge_items_per_axis.append(None)
  array_edges, _ = truncate_array_and_mask(
      array,
      np.ones((1,) * array.ndim, dtype=jnp.bool_),
      edge_items_per_axis=tuple(edge_items_per_axis),
  )
  prefix = "Array("
  datastring = np.array2string(
      np.array(array_edges),
      prefix=prefix,
      suffix=",",
      separator=", ",
      threshold=0,
      edgeitems=edgeitems,
  )
  return f"{prefix}{datastring}, {dtype_str}"
'''
          new = '''  is_prng_key = (
      hasattr(jax.dtypes, "prng_key")
      and jax.dtypes.issubdtype(array.dtype, jax.dtypes.prng_key)
  )
  array_for_repr = jax.random.key_data(array) if is_prng_key else array

  edgeitems = np.get_printoptions()["edgeitems"]
  edge_items_per_axis = []
  for size in array.shape:
    if size > 2 * edgeitems + 1:
      edge_items_per_axis.append(edgeitems)
    else:
      edge_items_per_axis.append(None)
  edge_items_per_axis.extend([None] * (array_for_repr.ndim - array.ndim))
  array_edges, _ = truncate_array_and_mask(
      array_for_repr,
      np.ones((1,) * array_for_repr.ndim, dtype=jnp.bool_),
      edge_items_per_axis=tuple(edge_items_per_axis),
  )
  prefix = "Array("
  datastring = np.array2string(
      np.array(array_edges),
      prefix=prefix,
      suffix=",",
      separator=", ",
      threshold=0,
      edgeitems=edgeitems,
  )
  if is_prng_key:
    return f"Array({array.shape}, dtype={array.dtype.name}) overlaying:\\n{datastring}"
  return f"{prefix}{datastring}, {dtype_str}"
'''
          source = once(source, old, new, 'faster_array_repr body')
          source_path.write_text(source)

          test_path = Path('tests/jax_support_test.py')
          test = test_path.read_text()
          marker = '''  def test_summarize_prng_key(self):
    keys = jax.random.split(jax.random.key(0, impl="threefry2x32"), 10)
    summarized = treescope.external.jax_support.summarize_array_data(keys)
    self.assertEqual(summarized, "")

    full_summary = helpers.ensure_text(
        treescope.external.jax_support.JAXArrayAdapter().get_array_summary(
            keys, fast=False
        )
    )
    self.assertEqual(full_summary, "jax.Array key<fry>(10,)")
'''
          replacement = marker + '''
  def test_faster_array_repr_large_prng_keys(self):
    keys = jax.random.split(jax.random.key(0, impl="threefry2x32"), 2000)

    rendered = treescope.external.jax_support.faster_array_repr(keys)

    self.assertIn("dtype=key<fry>", rendered)
    self.assertIn("overlaying:", rendered)
    self.assertLess(len(rendered), 2000)
'''
          test = once(test, marker, replacement, 'PRNG test insertion')
          test_path.write_text(test)
          PY
      - name: Commit patch
        run: |
          rm .github/workflows/apply-fix-71.yml
          git config user.name "Sylvester Kaczmarek"
          git config user.email "16242628+sylvesterkaczmarek@users.noreply.github.com"
          git add treescope/external/jax_support.py tests/jax_support_test.py .github/workflows/apply-fix-71.yml
          git commit -m "fix: render large typed PRNG key arrays"
          git push origin HEAD:${GITHUB_REF_NAME}
